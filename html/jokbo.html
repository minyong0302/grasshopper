<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>족보 | 아치셈틀</title>
    <link rel="stylesheet" href="../css/site-header.css" />
    <link rel="stylesheet" href="../css/jokbo.css" />
    <script src="../js/jokbo.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="logo">
        <a href="../index.html"><img src="../img/셈틀로고.png" alt="아치셈틀 홈" /></a>
      </div>
      <nav class="navbar" aria-label="주 메뉴">
        <a href="../index.html">홈</a>
        <a href="./members.html">집부 소개</a>
        <a href="./project.html">프로젝트</a>
        <a href="./schedule.html">동아리 일정</a>
        <a href="./activity.html">활동 기록</a>
        <a href="./contact.html">안내</a>
        <a href="./monitoring.html">모니터링</a>
        <a href="./jokbo.html" aria-current="page">족보</a>
      </nav>
    </header>
    
    <main class="jokbo-card">
      <h1>족보</h1>
      <p>동아리에 등록한 이메일을 인증하면 노션 자료실을 열 수 있어요.</p>
      <form id="email-form">
        <label for="email">이메일</label>
        <input id="email" type="email" maxlength="254" autocomplete="email" required />
        <button type="submit" disabled>인증번호 받기</button>
      </form>
      <form id="code-form" hidden>
        <label for="code">인증번호</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
          pattern="[0-9]{6}" maxlength="6" required />
        <button type="submit">인증하고 노션 열기</button>
      </form>
      <button id="change-email" type="button" hidden>이메일 변경</button>
      <p id="jokbo-status" role="status"></p>
      <noscript>이메일 인증을 사용하려면 자바스크립트를 켜주세요.</noscript>
    </main>
  </body>
</html>
